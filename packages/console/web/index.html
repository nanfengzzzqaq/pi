<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Pi 控制台</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<header class="topbar">
		<span class="logo">Pi 控制台</span>
	<div class="topbar-controls">
		<select id="model-select" title="模型" disabled>
			<option value="">加载模型中…</option>
		</select>
		<select id="thinking-select" title="思考等级" disabled>
			<option value="off">off</option>
			<option value="minimal">minimal</option>
			<option value="low">low</option>
			<option value="medium">medium</option>
			<option value="high">high</option>
			<option value="xhigh">xhigh</option>
			<option value="max">max</option>
		</select>
		<button id="settings-btn" class="icon-btn" title="设置（模型服务 / 更新）">⚙</button>
	</div>
		<span id="conn-state" class="conn-state">连接中…</span>
	</header>

	<div class="layout">
		<aside class="sidebar" id="sidebar">
			<div class="sidebar-header" id="packs-toggle">能力包 <span class="chevron" id="packs-chevron">▾</span></div>
			<div id="packs-panel" class="packs-panel">
				<div id="packs-list" class="packs-list">加载中…</div>
			</div>
		</aside>

		<main class="content">
			<div id="error-bar" class="error-bar" hidden></div>

			<main id="messages" class="messages"></main>

			<div id="indicator" class="indicator" hidden>思考中…</div>

			<footer class="composer">
				<div class="attachments" id="attachments" hidden></div>
				<div class="composer-row">
					<button id="attach-btn" class="icon-btn" title="添加附件">📎</button>
					<input type="file" id="file-input" multiple hidden>
					<textarea id="input" rows="3" placeholder="输入消息，Enter 发送，Shift+Enter 换行" disabled></textarea>
					<div class="composer-buttons">
						<button id="send-btn" disabled>发送</button>
						<button id="stop-btn" hidden>停止</button>
					</div>
				</div>
			</footer>
		</main>
	</div>

	<div id="drop-overlay" class="drop-overlay" hidden>
		<div class="drop-overlay-inner">📥 释放以添加附件</div>
	</div>

	<div id="settings-modal" class="modal" hidden>
		<div class="modal-body">
			<div class="modal-header">
				<span class="modal-title">设置</span>
				<button id="settings-close" class="icon-btn" title="关闭">×</button>
			</div>

			<section class="modal-section">
				<h3>模型服务</h3>
				<p class="modal-hint">添加模型厂商的 API Key 后，对应模型即可在顶栏选择使用（与设置一起持久保存）。</p>
				<div class="key-add-row">
					<select id="key-provider"></select>
					<input type="password" id="key-input" placeholder="粘贴 API Key（sk-…）" autocomplete="off">
					<button id="key-add-btn">添加</button>
				</div>
				<div id="key-list" class="key-list"></div>
			</section>

			<section class="modal-section">
				<h3>关于与更新</h3>
				<div class="update-row">
					<span id="app-version">版本 …</span>
					<button id="update-check-btn">检查更新</button>
					<button id="update-run-btn" hidden>立即更新</button>
				</div>
				<div id="update-status" class="update-status"></div>
				<div class="download-bar-wrap" id="update-progress" hidden>
					<div class="download-bar" id="update-progress-bar"></div>
				</div>
				<p class="modal-hint" id="github-token-hint">更新源是 GitHub 上的私有仓库时，需要填写有读取权限的 Personal Access Token（公开仓库无需填写）。</p>
				<div class="key-add-row">
					<input type="password" id="github-token-input" placeholder="GitHub Token（ghp_…，可选）" autocomplete="off">
					<button id="github-token-save-btn">保存</button>
					<button id="github-token-clear-btn" hidden>清除</button>
				</div>
			</section>
		</div>
	</div>

	<script src="/app.js"></script>
</body>
</html>
