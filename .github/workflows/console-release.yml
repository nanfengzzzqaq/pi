name: Release Pi Console

on:
  push:
    branches:
      - downstream
    paths-ignore:
      - .github/workflows/console-release.yml
  workflow_dispatch:
    inputs:
      recovery_run_id:
        description: 'Failed release run containing the verified installer artifact'
        required: true
        type: string
      recovery_source_sha:
        description: 'Exact commit referenced by the release tag and ownership marker'
        required: true
        type: string
      recovery_version:
        description: 'Console version without the v prefix'
        required: true
        type: string
      recovery_release_id:
        description: 'Workflow-owned draft release ID'
        required: true
        type: string
      recovery_expected_size:
        description: 'Verified installer size in bytes'
        required: true
        type: string
      recovery_expected_sha256:
        description: 'Verified installer SHA-256 digest'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-pi-console-downstream
  cancel-in-progress: false

jobs:
  prepare:
    name: Check Console release version
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_mode: ${{ steps.release.outputs.release_mode }}
      release_needed: ${{ steps.release.outputs.release_needed }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check whether this version needs a release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./packages/console/package.json').version")"
          electron_version="$(node -p "require('./packages/console/installer/electron/package.json').version")"
          lock_version="$(node -p "require('./packages/console/installer/electron/package-lock.json').version")"
          lock_root_version="$(node -p "require('./packages/console/installer/electron/package-lock.json').packages[''].version")"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Console version must use X.Y.Z format; found ${VERSION}."
            exit 1
          fi
          if [[ "${electron_version}" != "${VERSION}" || "${lock_version}" != "${VERSION}" || "${lock_root_version}" != "${VERSION}" ]]; then
            echo "::error::Console versions do not match: package=${VERSION}, electron=${electron_version}, lock=${lock_version}, lock-root=${lock_root_version}."
            exit 1
          fi

          SOURCE_SHA="$(git rev-parse HEAD)"
          if [[ "${SOURCE_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Checked out ${SOURCE_SHA}, expected pushed commit ${GITHUB_SHA}."
            exit 1
          fi

          RELEASE_TAG="v${VERSION}"
          release_title="Pi Console ${RELEASE_TAG}"
          release_marker="<!-- pi-console-release-workflow-owned:v1 tag=${RELEASE_TAG} source=${SOURCE_SHA} -->"
          asset_marker="pi-console-release-workflow-owned:v1:${RELEASE_TAG}:${SOURCE_SHA}"
          expected_asset="PiConsole-Setup-${VERSION}.exe"
          assert_exact_published_release_file() {
            local release_path="$1"
            local expected_id="${2:-}"
            local actual_id
            if ! actual_id="$(jq -r '.id // empty' "${release_path}")"; then
              echo "::error::Unable to read the published release ID." >&2
              return 1
            fi
            if [[ ! "${actual_id}" =~ ^[1-9][0-9]*$ ]] \
              || [[ -n "${expected_id}" && "${actual_id}" != "${expected_id}" ]]; then
              echo "::error::The published release has an unexpected numeric ID." >&2
              return 1
            fi
            if ! jq -e \
              --argjson id "${actual_id}" \
              --arg marker "${release_marker}" \
              --arg tag "${RELEASE_TAG}" \
              --arg title "${release_title}" \
              --arg asset_name "${expected_asset}" \
              --arg asset_marker "${asset_marker}" '
                def marker_count($marker):
                  ((.body // "") | split("\n") | map(rtrimstr("\r")) | map(select(. == $marker)) | length);
                .id == $id
                and .draft == false
                and .prerelease == false
                and .tag_name == $tag
                and .name == $title
                and .author.login == "github-actions[bot]"
                and marker_count($marker) == 1
                and ((.assets // []) | length) == 1
                and ([
                  (.assets // [])[]
                  | select(
                      ((.id | type) == "number" and .id > 0)
                      and .name == $asset_name
                      and .label == $asset_marker
                      and .state == "uploaded"
                      and .size > 0
                      and ((.digest // "") | test("^sha256:[0-9a-fA-F]{64}$"))
                    )
                ] | length) == 1
              ' "${release_path}" >/dev/null; then
              echo "::error::Published release ownership or asset validation failed." >&2
              return 1
            fi
          }
          load_release_inventory() {
            local inventory
            if ! inventory="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -sc 'add // []')"; then
              echo "::error::Unable to inspect the complete GitHub Release inventory." >&2
              return 1
            fi
            if ! jq -e 'type == "array"' <<< "${inventory}" >/dev/null; then
              echo "::error::GitHub returned an invalid Release inventory." >&2
              return 1
            fi
            printf '%s' "${inventory}"
          }
          classify_release_inventory() {
            jq -c \
              --arg marker "${release_marker}" \
              --arg asset_marker "${asset_marker}" \
              --arg tag "${RELEASE_TAG}" \
              --arg title "${release_title}" '
                def marker_count($marker):
                  ((.body // "") | split("\n") | map(rtrimstr("\r")) | map(select(. == $marker)) | length);
                def asset_marker_count($asset_marker):
                  [(.assets // [])[] | select(.label == $asset_marker)] | length;
                def allowed_draft_tag($tag):
                  .tag_name == $tag or ((.tag_name // "") | test("^untagged-[0-9a-f]{20}$"));
                def owned($marker; $tag; $title):
                  .draft == true
                  and .prerelease == false
                  and ((.id | type) == "number" and .id > 0)
                  and .name == $title
                  and .author.login == "github-actions[bot]"
                  and marker_count($marker) == 1
                  and allowed_draft_tag($tag);
                {
                  owned: [.[] | select(owned($marker; $tag; $title))],
                  conflicts: [
                    .[]
                    | select(
                        .tag_name == $tag
                        or .name == $title
                        or marker_count($marker) > 0
                        or asset_marker_count($asset_marker) > 0
                      )
                    | select((owned($marker; $tag; $title)) | not)
                  ]
                }
              '
          }
          assert_recoverable_inventory() {
            local inventory="$1"
            local classification
            local owned_count
            local conflict_count
            if ! classification="$(classify_release_inventory <<< "${inventory}")" \
              || ! owned_count="$(jq '.owned | length' <<< "${classification}")" \
              || ! conflict_count="$(jq '.conflicts | length' <<< "${classification}")"; then
              echo "::error::Unable to classify the GitHub Release inventory." >&2
              return 1
            fi
            if [[ "${owned_count}" -gt 1 || "${conflict_count}" != "0" ]]; then
              echo "::error::Release recovery is ambiguous or contains an unowned release for ${RELEASE_TAG}." >&2
              return 1
            fi
            printf '%s' "${classification}"
          }

          response_file="$(mktemp)"
          http_status="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"

          case "${http_status}" in
            200)
              tag_type="$(jq -r '.object.type' "${response_file}")"
              tag_sha="$(jq -r '.object.sha' "${response_file}")"
              if [[ "${tag_type}" != "commit" || "${tag_sha}" != "${SOURCE_SHA}" ]]; then
                echo "::error::${RELEASE_TAG} exists but points to ${tag_type} ${tag_sha}; expected commit ${SOURCE_SHA}. Bump the Console version or repair the tag before rerunning."
                exit 1
              fi

              release_file="$(mktemp)"
              release_status="$(curl --silent --show-error \
                --output "${release_file}" \
                --write-out '%{http_code}' \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
              if [[ "${release_status}" == "404" ]]; then
                release_inventory="$(load_release_inventory)"
                release_classification="$(assert_recoverable_inventory "${release_inventory}")"
                owned_count="$(jq '.owned | length' <<< "${release_classification}")"
                release_needed=true
                release_mode=recover
                if [[ "${owned_count}" == "1" ]]; then
                  owned_release_id="$(jq -r '.owned[0].id' <<< "${release_classification}")"
                  echo "::warning::${RELEASE_TAG} has one workflow-owned draft release (${owned_release_id}); rebuilding the installer for exact recovery."
                else
                  echo "::warning::${RELEASE_TAG} has no published or draft release; rebuilding the installer for tag-only recovery."
                fi
              elif [[ "${release_status}" == "200" ]]; then
                if ! endpoint_release_id="$(jq -r '.id // empty' "${release_file}")" \
                  || [[ ! "${endpoint_release_id}" =~ ^[1-9][0-9]*$ ]]; then
                  echo "::error::The canonical release endpoint returned an invalid release ID."
                  exit 1
                fi
                if ! release_inventory="$(load_release_inventory)" \
                  || ! published_release_id="$(jq -er \
                    --arg marker "${release_marker}" \
                    --arg asset_marker "${asset_marker}" \
                    --arg tag "${RELEASE_TAG}" \
                    --arg title "${release_title}" '
                      def marker_count($marker):
                        ((.body // "") | split("\n") | map(rtrimstr("\r")) | map(select(. == $marker)) | length);
                      def asset_marker_count($asset_marker):
                        [(.assets // [])[] | select(.label == $asset_marker)] | length;
                      [
                        .[]
                        | select(
                            .tag_name == $tag
                            or .name == $title
                            or marker_count($marker) > 0
                            or asset_marker_count($asset_marker) > 0
                          )
                      ] as $relevant
                      | if (($relevant | length) == 1
                          and (($relevant[0].id | type) == "number" and $relevant[0].id > 0))
                        then $relevant[0].id
                        else error("relevant release is not unique")
                        end
                    ' <<< "${release_inventory}")"; then
                  echo "::error::Published ${RELEASE_TAG} is not globally unique or a relevant unowned release exists."
                  exit 1
                fi
                if [[ "${published_release_id}" != "${endpoint_release_id}" ]]; then
                  echo "::error::The canonical endpoint and paginated inventory disagree on the release ID."
                  exit 1
                fi
                if ! latest_release_file="$(mktemp)" \
                  || ! gh api "repos/${GITHUB_REPOSITORY}/releases/${published_release_id}" > "${latest_release_file}" \
                  || ! latest_tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"; then
                  echo "::error::Unable to reload the published release and exact tag reference."
                  exit 1
                fi
                if [[ "$(jq -r '.object.type' <<< "${latest_tag_json}")" != "commit" \
                  || "$(jq -r '.object.sha' <<< "${latest_tag_json}")" != "${SOURCE_SHA}" ]] \
                  || ! assert_exact_published_release_file "${latest_release_file}" "${published_release_id}"; then
                  echo "::error::The latest published release or exact tag reference failed revalidation."
                  exit 1
                fi
                release_needed=false
                release_mode=noop
                echo "::notice::${RELEASE_TAG} is already published from ${SOURCE_SHA} with the owned installer; nothing to do."
              else
                echo "::error::Unable to inspect the GitHub Release for ${RELEASE_TAG}; GitHub API returned HTTP ${release_status}."
                exit 1
              fi
              ;;
            404)
              release_inventory="$(load_release_inventory)"
              release_classification="$(classify_release_inventory <<< "${release_inventory}")"
              owned_count="$(jq '.owned | length' <<< "${release_classification}")"
              conflict_count="$(jq '.conflicts | length' <<< "${release_classification}")"
              if [[ "${owned_count}" != "0" || "${conflict_count}" != "0" ]]; then
                echo "::error::${RELEASE_TAG} has no Git tag but a relevant release exists; refusing to create or modify anything."
                exit 1
              fi
              release_needed=true
              release_mode=create
              echo "::notice::${RELEASE_TAG} does not exist; validating and building commit ${SOURCE_SHA}."
              ;;
            *)
              echo "::error::Unable to check ${RELEASE_TAG}; GitHub API returned HTTP ${http_status}."
              exit 1
              ;;
          esac

          echo "release_mode=${release_mode}" >> "${GITHUB_OUTPUT}"
          echo "release_needed=${release_needed}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  validate-ubuntu:
    name: Validate repository (Ubuntu)
    needs: prepare
    if: ${{ needs.prepare.outputs.release_needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

  build-windows:
    name: Validate and build Pi Console (Windows)
    needs:
      - prepare
      - validate-ubuntu
    if: ${{ needs.prepare.outputs.release_needed == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Verify release source
        shell: pwsh
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          if ($actualSha -ne $env:SOURCE_SHA) {
              throw "Checked out $actualSha, expected $env:SOURCE_SHA"
          }
          $actualVersion = (node -p "require('./packages/console/package.json').version").Trim()
          $electronVersion = (node -p "require('./packages/console/installer/electron/package.json').version").Trim()
          $lockVersion = (node -p "require('./packages/console/installer/electron/package-lock.json').version").Trim()
          $lockRootVersion = (node -p "require('./packages/console/installer/electron/package-lock.json').packages[''].version").Trim()
          if ($actualVersion -ne $env:VERSION -or $electronVersion -ne $env:VERSION -or $lockVersion -ne $env:VERSION -or $lockRootVersion -ne $env:VERSION) {
              throw "Console versions do not match: package=$actualVersion, electron=$electronVersion, lock=$lockVersion, lock-root=$lockRootVersion, expected=$env:VERSION"
          }
          if ($env:RELEASE_TAG -ne "v$($env:VERSION)") {
              throw "Release tag $env:RELEASE_TAG does not match Console version $env:VERSION"
          }

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Pi packages
        run: npm run build

      - name: Test Windows client
        run: npm test --workspace=@pi/console -- --maxWorkers=1

      - name: Check packaged scripts
        run: |
          node --check packages/console/installer/electron/main.js
          node --check packages/console/web/app.js

      - name: Download and verify OfficeCLI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $downloadHeaders = @{ "User-Agent" = "pi-console-release" }
          $apiHeaders = @{
              Accept = "application/vnd.github+json"
              Authorization = "Bearer $env:GH_TOKEN"
              "User-Agent" = "pi-console-release"
              "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = $null
          try {
              $release = Invoke-RestMethod -Headers $apiHeaders -Uri "https://api.github.com/repos/iOfficeAI/OfficeCLI/releases/latest"
              $releaseTag = "$($release.tag_name)"
          } catch {
              Write-Warning "Authenticated OfficeCLI release lookup failed; falling back to the official latest-release redirect."
              $latest = Invoke-WebRequest -Headers $downloadHeaders -Uri "https://github.com/iOfficeAI/OfficeCLI/releases/latest"
              $releaseUri = $latest.BaseResponse.RequestMessage.RequestUri.AbsoluteUri
              $tagMatch = [regex]::Match($releaseUri, '/releases/tag/([^/?#]+)')
              if (-not $tagMatch.Success) {
                  throw "Unable to resolve the latest OfficeCLI release tag from $releaseUri"
              }
              $releaseTag = [uri]::UnescapeDataString($tagMatch.Groups[1].Value)
          }
          if (-not $releaseTag) { throw "Latest OfficeCLI release did not provide a tag" }
          $assetName = "officecli-win-x64.exe"
          $downloadBase = "https://github.com/iOfficeAI/OfficeCLI/releases/download/$releaseTag"

          $binDir = Join-Path $env:GITHUB_WORKSPACE "packages\console\data\bin"
          New-Item -ItemType Directory -Path $binDir -Force | Out-Null
          $binaryPath = Join-Path $binDir "officecli.exe"
          Invoke-WebRequest -Headers $downloadHeaders -Uri "$downloadBase/$assetName" -OutFile $binaryPath
          if (-not (Test-Path -LiteralPath $binaryPath) -or (Get-Item -LiteralPath $binaryPath).Length -le 0) {
              throw "Downloaded OfficeCLI binary is empty"
          }

          $expectedHash = $null
          if ($release) {
              $apiAssets = @($release.assets | Where-Object { $_.name -eq $assetName })
              if ($apiAssets.Count -eq 1 -and "$($apiAssets[0].digest)" -match '^sha256:([0-9a-fA-F]{64})$') {
                  $expectedHash = $Matches[1].ToLowerInvariant()
              }
          }
          $sumsPath = Join-Path $env:RUNNER_TEMP "officecli-SHA256SUMS"
          if (-not $expectedHash) {
              Invoke-WebRequest -Headers $downloadHeaders -Uri "$downloadBase/SHA256SUMS" -OutFile $sumsPath
              foreach ($line in Get-Content -LiteralPath $sumsPath) {
                  $match = [regex]::Match($line.Trim(), '^([0-9a-fA-F]{64})\s+\*?(.+)$')
                  if ($match.Success -and $match.Groups[2].Value.Trim() -eq $assetName) {
                      $expectedHash = $match.Groups[1].Value.ToLowerInvariant()
                      break
                  }
              }
          }
          if (-not $expectedHash) {
              throw "Unable to obtain the official SHA-256 for $assetName"
          }
          $actualHash = (Get-FileHash -LiteralPath $binaryPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
              throw "OfficeCLI SHA-256 mismatch: expected $expectedHash, got $actualHash"
          }

          $probe = (& $binaryPath --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $probe) {
              throw "Downloaded OfficeCLI binary did not pass its version probe"
          }
          $record = @{
              version = $releaseTag -replace '^v', ''
              downloadedAt = (Get-Date).ToUniversalTime().ToString("o")
              sha256 = $expectedHash
          }
          $record | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $binDir "officecli.json") -Encoding utf8
          Write-Host "Verified OfficeCLI $probe ($actualHash)"

      - name: Build Windows installer
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/console/installer/electron-build.ps1

      - name: Verify installer
        id: installer
        shell: pwsh
        run: |
          $expectedName = "PiConsole-Setup-$($env:VERSION).exe"
          $expectedPath = Join-Path $env:GITHUB_WORKSPACE "packages\console\installer\electron\dist\$expectedName"
          $packagedVersion = (node packages/console/installer/get-version.cjs packages/console/installer/electron/package.json).Trim()
          if ($packagedVersion -ne $env:VERSION) {
              throw "Packaged Console version is $packagedVersion, expected $env:VERSION"
          }
          if (-not (Test-Path -LiteralPath $expectedPath)) {
              throw "Expected installer was not created: $expectedName"
          }
          $installer = Get-Item -LiteralPath $expectedPath
          if ($installer.Name -ne $expectedName -or $installer.Length -le 0) {
              throw "Installer name or size is invalid"
          }
          $hash = (Get-FileHash -LiteralPath $expectedPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Verified $($installer.Name), $($installer.Length) bytes, SHA-256 $hash"

      - name: Upload verified installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-console-${{ env.SOURCE_SHA }}
          path: packages/console/installer/electron/dist/PiConsole-Setup-${{ env.VERSION }}.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Tag and publish Pi Console
    needs:
      - prepare
      - build-windows
    if: ${{ needs.prepare.outputs.release_needed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_MODE: ${{ needs.prepare.outputs.release_mode }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download verified installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pi-console-${{ env.SOURCE_SHA }}
          path: release-assets

      - name: Create tag and GitHub Release
        run: |
          set -Eeuo pipefail

          asset="release-assets/PiConsole-Setup-${VERSION}.exe"
          if [[ ! -s "${asset}" ]]; then
            echo "::error::Verified installer is missing or empty: ${asset}"
            exit 1
          fi
          asset_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "${asset_count}" != "1" ]]; then
            echo "::error::Expected exactly one release asset, found ${asset_count}."
            exit 1
          fi

          failure_guard_enabled=false
          active_release_id=""
          release_operation=create
          target_name="$(basename "${asset}")"
          release_title="Pi Console ${RELEASE_TAG}"
          release_marker="<!-- pi-console-release-workflow-owned:v1 tag=${RELEASE_TAG} source=${SOURCE_SHA} -->"
          asset_marker="pi-console-release-workflow-owned:v1:${RELEASE_TAG}:${SOURCE_SHA}"
          stale_prefix="${target_name}.pi-console-stale-"
          has_exact_release_marker() {
            jq -e --arg marker "${release_marker}" '((.body // "") | split("\n") | map(rtrimstr("\r")) | map(select(. == $marker)) | length) == 1' >/dev/null
          }
          load_release_inventory() {
            local inventory
            if ! inventory="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -sc 'add // []')"; then
              echo "::error::Unable to inspect the complete GitHub Release inventory." >&2
              return 1
            fi
            if ! jq -e 'type == "array"' <<< "${inventory}" >/dev/null; then
              echo "::error::GitHub returned an invalid Release inventory." >&2
              return 1
            fi
            printf '%s' "${inventory}"
          }
          classify_release_inventory() {
            jq -c \
              --arg marker "${release_marker}" \
              --arg asset_marker "${asset_marker}" \
              --arg tag "${RELEASE_TAG}" \
              --arg title "${release_title}" '
                def marker_count($marker):
                  ((.body // "") | split("\n") | map(rtrimstr("\r")) | map(select(. == $marker)) | length);
                def asset_marker_count($asset_marker):
                  [(.assets // [])[] | select(.label == $asset_marker)] | length;
                def allowed_draft_tag($tag):
                  .tag_name == $tag or ((.tag_name // "") | test("^untagged-[0-9a-f]{20}$"));
                def owned($marker; $tag; $title):
                  .draft == true
                  and .prerelease == false
                  and ((.id | type) == "number" and .id > 0)
                  and .name == $title
                  and .author.login == "github-actions[bot]"
                  and marker_count($marker) == 1
                  and allowed_draft_tag($tag);
                {
                  owned: [.[] | select(owned($marker; $tag; $title))],
                  conflicts: [
                    .[]
                    | select(
                        .tag_name == $tag
                        or .name == $title
                        or marker_count($marker) > 0
                        or asset_marker_count($asset_marker) > 0
                      )
                    | select((owned($marker; $tag; $title)) | not)
                  ]
                }
              '
          }
          assert_recoverable_inventory() {
            local inventory="$1"
            local classification
            local owned_count
            local conflict_count
            if ! classification="$(classify_release_inventory <<< "${inventory}")" \
              || ! owned_count="$(jq '.owned | length' <<< "${classification}")" \
              || ! conflict_count="$(jq '.conflicts | length' <<< "${classification}")"; then
              echo "::error::Unable to classify the GitHub Release inventory." >&2
              return 1
            fi
            if [[ "${owned_count}" -gt 1 || "${conflict_count}" != "0" ]]; then
              echo "::error::Release recovery is ambiguous or contains an unowned release for ${RELEASE_TAG}." >&2
              return 1
            fi
            printf '%s' "${classification}"
          }
          assert_exact_tag_ref() {
            local current_tag
            if ! current_tag="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"; then
              echo "::error::Unable to reload the exact tag reference for ${RELEASE_TAG}." >&2
              return 1
            fi
            if [[ "$(jq -r '.object.type' <<< "${current_tag}")" != "commit" \
              || "$(jq -r '.object.sha' <<< "${current_tag}")" != "${SOURCE_SHA}" ]]; then
              echo "::error::${RELEASE_TAG} no longer points directly to commit ${SOURCE_SHA}." >&2
              return 1
            fi
          }
          get_public_release_status() {
            local output_file="$1"
            local status
            if ! status="$(curl --silent --show-error \
              --output "${output_file}" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"; then
              echo "::error::Unable to inspect the public release endpoint for ${RELEASE_TAG}." >&2
              return 1
            fi
            if [[ "${status}" != "200" && "${status}" != "404" ]]; then
              echo "::error::Public release inspection returned HTTP ${status} for ${RELEASE_TAG}." >&2
              return 1
            fi
            printf '%s' "${status}"
          }
          assert_draft_tag_binding() {
            local current_release="$1"
            local draft_tag
            local encoded_tag
            local synthetic_ref_file
            local synthetic_ref_status
            if ! draft_tag="$(jq -r '.tag_name // empty' <<< "${current_release}")"; then
              echo "::error::Unable to read the active draft tag name." >&2
              return 1
            fi
            if [[ "${draft_tag}" == "${RELEASE_TAG}" ]]; then
              return 0
            fi
            if [[ ! "${draft_tag}" =~ ^untagged-[0-9a-f]{20}$ ]]; then
              echo "::error::The active draft has an unsupported tag name." >&2
              return 1
            fi
            if ! encoded_tag="$(jq -nr --arg value "${draft_tag}" '$value | @uri')" \
              || ! synthetic_ref_file="$(mktemp)"; then
              echo "::error::Unable to prepare the synthetic tag reference check." >&2
              return 1
            fi
            if ! synthetic_ref_status="$(curl --silent --show-error \
              --output "${synthetic_ref_file}" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/tags/${encoded_tag}")"; then
              echo "::error::Unable to prove that synthetic tag ref ${draft_tag} is absent." >&2
              return 1
            fi
            if [[ "${synthetic_ref_status}" != "404" ]]; then
              echo "::error::Synthetic tag ref ${draft_tag} returned HTTP ${synthetic_ref_status}; refusing draft mutation." >&2
              return 1
            fi
          }
          assert_owned_draft_json() {
            local current_release="$1"
            if [[ ! "${active_release_id}" =~ ^[0-9]+$ ]]; then
              echo "::error::No numeric active release ID is available." >&2
              return 1
            fi
            jq -e \
              --argjson id "${active_release_id}" \
              --arg marker "${release_marker}" \
              --arg tag "${RELEASE_TAG}" \
              --arg title "${release_title}" '
                def marker_count($marker):
                  ((.body // "") | split("\n") | map(rtrimstr("\r")) | map(select(. == $marker)) | length);
                .id == $id
                and .draft == true
                and .prerelease == false
                and .name == $title
                and .author.login == "github-actions[bot]"
                and marker_count($marker) == 1
                and (.tag_name == $tag or ((.tag_name // "") | test("^untagged-[0-9a-f]{20}$")))
              ' <<< "${current_release}" >/dev/null
          }
          load_active_draft() {
            local current_release
            local current_inventory
            local current_classification
            local owned_count
            local attempt=1
            local max_attempts=1
            if [[ "${1:-}" == "--wait-for-created-draft" ]]; then
              max_attempts=6
            elif [[ "$#" != "0" ]]; then
              echo "::error::Unsupported draft validation option." >&2
              return 1
            fi
            if [[ ! "${active_release_id}" =~ ^[0-9]+$ ]]; then
              echo "::error::No numeric active release ID is available." >&2
              return 1
            fi
            while true; do
              if ! assert_exact_tag_ref; then
                return 1
              fi
              if ! current_inventory="$(load_release_inventory)" \
                || ! current_classification="$(assert_recoverable_inventory "${current_inventory}")"; then
                return 1
              fi
              owned_count="$(jq '.owned | length' <<< "${current_classification}")"
              if [[ "${owned_count}" == "1" \
                && "$(jq -r '.owned[0].id' <<< "${current_classification}")" == "${active_release_id}" ]]; then
                break
              fi
              # A newly created draft can be absent from the paginated inventory
              # briefly. Retry only absence, never conflicting or different IDs.
              if [[ "${owned_count}" != "0" || "${attempt}" -ge "${max_attempts}" ]]; then
                echo "::error::Release ${active_release_id} is no longer the unique workflow-owned draft for ${RELEASE_TAG}." >&2
                return 1
              fi
              echo "::notice::Waiting for newly created draft ${active_release_id} to appear in the release inventory (${attempt}/${max_attempts})." >&2
              sleep 2
              attempt=$((attempt + 1))
            done
            if ! current_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${active_release_id}")"; then
              echo "::error::Unable to reload release ${active_release_id} by numeric ID." >&2
              return 1
            fi
            if ! assert_owned_draft_json "${current_release}"; then
              echo "::error::Release ${active_release_id} no longer has exact workflow ownership." >&2
              return 1
            fi
            if ! assert_draft_tag_binding "${current_release}"; then
              return 1
            fi
            printf '%s' "${current_release}"
          }
          preserve_failed_publish() {
            failure_status="$?"
            set +e
            if [[ "${failure_guard_enabled}" == "true" ]]; then
              echo "::warning::Release publication failed and no failure cleanup ran; tag ${RELEASE_TAG}, release ${active_release_id:-not-created}, and all remaining assets were preserved for fail-closed recovery." >&2
            fi
            exit "${failure_status}"
          }
          trap preserve_failed_publish ERR

          case "${RELEASE_MODE}" in
            create)
              response_file="$(mktemp)"
              http_status="$(curl --silent --show-error \
                --output "${response_file}" \
                --write-out '%{http_code}' \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
              if [[ "${http_status}" != "404" ]]; then
                echo "::error::Expected ${RELEASE_TAG} to be absent before creation; GitHub API returned HTTP ${http_status}."
                exit 1
              fi
              release_inventory="$(load_release_inventory)"
              release_classification="$(classify_release_inventory <<< "${release_inventory}")"
              if [[ "$(jq '.owned | length' <<< "${release_classification}")" != "0" \
                || "$(jq '.conflicts | length' <<< "${release_classification}")" != "0" ]]; then
                echo "::error::A relevant release appeared before tag creation; refusing to modify anything."
                exit 1
              fi
              failure_guard_enabled=true
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                --field ref="refs/tags/${RELEASE_TAG}" \
                --field sha="${SOURCE_SHA}" >/dev/null
              ;;
            recover)
              assert_exact_tag_ref
              public_release_file="$(mktemp)"
              public_release_status="$(get_public_release_status "${public_release_file}")"
              if [[ "${public_release_status}" != "404" ]]; then
                echo "::error::${RELEASE_TAG} became public while the installer was building; refusing recovery."
                exit 1
              fi
              release_inventory="$(load_release_inventory)"
              release_classification="$(assert_recoverable_inventory "${release_inventory}")"
              release_match_count="$(jq '.owned | length' <<< "${release_classification}")"
              if [[ "${release_match_count}" == "1" ]]; then
                active_release_id="$(jq -r '.owned[0].id' <<< "${release_classification}")"
                release_operation=reuse
              fi
              failure_guard_enabled=true
              if [[ "${release_operation}" == "reuse" ]]; then
                load_active_draft >/dev/null
              fi
              ;;
            *)
              echo "::error::Unknown Console release mode: ${RELEASE_MODE}."
              exit 1
              ;;
          esac

          assert_exact_tag_ref

          notes_file="$(mktemp)"
          {
            printf '## Pi Console %s\n' "${RELEASE_TAG}"
            echo
            echo 'Windows 安装包由本页标注的源码提交构建，已通过仓库检查、客户端测试和安装包校验。'
            echo '可下载安装包更新；具体变更请查看对应源码提交。'
            printf '设计与改进说明：[查看文档](https://github.com/%s/blob/%s/packages/console/docs/stability-design.md)。\n' "${GITHUB_REPOSITORY}" "${RELEASE_TAG}"
            echo
            printf '构建来源：`%s`。\n' "${SOURCE_SHA}"
            printf '%s\n' "${release_marker}"
          } > "${notes_file}"

          assert_known_asset_set() {
            jq -e \
              --arg target "${target_name}" \
              --arg marker "${asset_marker}" \
              --arg prefix "${stale_prefix}" '
                def owned_target:
                  .name == $target and .label == $marker;
                def owned_stale:
                  .label == $marker
                  and (.name | startswith($prefix))
                  and ((.name | ltrimstr($prefix)) | test("^(run-[0-9]+-[0-9]+|asset-[0-9]+)$"));
                ((.assets // []) | map(select(owned_target)) | length) <= 1
                and ((.assets // []) | map(select((owned_target or owned_stale) | not)) | length) == 0
              ' >/dev/null
          }

          local_asset_size="$(stat -c '%s' "${asset}")"
          local_asset_sha256="$(sha256sum "${asset}" | awk '{print $1}')"
          if [[ ! "${local_asset_size}" =~ ^[1-9][0-9]*$ || ! "${local_asset_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to fingerprint the verified installer."
            exit 1
          fi

          asset_matches_local() {
            local asset_id="$1"
            local asset_size="$2"
            local asset_digest="${3:-}"
            local downloaded_asset
            local downloaded_sha256
            if [[ ! "${asset_id}" =~ ^[0-9]+$ || ! "${asset_size}" =~ ^[0-9]+$ ]]; then
              echo "::error::A release asset has invalid identity metadata." >&2
              return 2
            fi
            if [[ "${asset_size}" != "${local_asset_size}" ]]; then
              return 1
            fi
            if [[ "${asset_digest}" =~ ^sha256:([0-9a-fA-F]{64})$ ]]; then
              [[ "${BASH_REMATCH[1],,}" == "${local_asset_sha256}" ]]
              return
            fi
            downloaded_asset="$(mktemp)"
            if ! curl --fail --location --silent --show-error \
              --output "${downloaded_asset}" \
              --header "Accept: application/octet-stream" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"; then
              echo "::error::Unable to download release asset ${asset_id} for exact verification." >&2
              return 2
            fi
            downloaded_sha256="$(sha256sum "${downloaded_asset}" | awk '{print $1}')"
            [[ "${downloaded_sha256}" == "${local_asset_sha256}" ]]
          }

          upload_candidate_asset() {
            local current_draft
            local upload_url
            local expected_upload_url
            local encoded_name
            local encoded_label
            local upload_response
            local upload_status
            current_draft="$(load_active_draft)"
            upload_url="$(jq -r '.upload_url | sub("\\{.*$"; "")' <<< "${current_draft}")"
            expected_upload_url="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${active_release_id}/assets"
            if [[ "${upload_url}" != "${expected_upload_url}" ]]; then
              echo "::error::Unexpected upload endpoint for release ${active_release_id}." >&2
              return 1
            fi
            candidate_name="${stale_prefix}run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            encoded_name="$(jq -nr --arg value "${candidate_name}" '$value | @uri')"
            encoded_label="$(jq -nr --arg value "${asset_marker}" '$value | @uri')"
            upload_response="$(mktemp)"
            if ! upload_status="$(curl --fail --silent --show-error \
              --output "${upload_response}" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Content-Type: application/octet-stream" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @"${asset}" \
              "${upload_url}?name=${encoded_name}&label=${encoded_label}")"; then
              echo "::error::Unable to upload the marked candidate installer." >&2
              return 1
            fi
            candidate_asset_id="$(jq -r '.id' "${upload_response}")"
            candidate_asset_size="$(jq -r '.size' "${upload_response}")"
            candidate_asset_digest="$(jq -r '.digest // ""' "${upload_response}")"
            if [[ "${upload_status}" != "201" \
              || ! "${candidate_asset_id}" =~ ^[0-9]+$ \
              || "$(jq -r '.name' "${upload_response}")" != "${candidate_name}" \
              || "$(jq -r '.label' "${upload_response}")" != "${asset_marker}" \
              || "${candidate_asset_size}" != "${local_asset_size}" ]]; then
              echo "::error::GitHub did not confirm the marked candidate installer asset." >&2
              return 1
            fi
          }

          if [[ "${release_operation}" == "create" ]]; then
            assert_exact_tag_ref
            public_release_file="$(mktemp)"
            public_release_status="$(get_public_release_status "${public_release_file}")"
            if [[ "${public_release_status}" != "404" ]]; then
              echo "::error::A public ${RELEASE_TAG} release appeared before draft creation."
              exit 1
            fi
            release_inventory="$(load_release_inventory)"
            release_classification="$(classify_release_inventory <<< "${release_inventory}")"
            if [[ "$(jq '.owned | length' <<< "${release_classification}")" != "0" \
              || "$(jq '.conflicts | length' <<< "${release_classification}")" != "0" ]]; then
              echo "::error::A relevant release appeared before draft creation; refusing to create another."
              exit 1
            fi
            create_payload="$(jq -cn \
              --arg tag "${RELEASE_TAG}" \
              --arg target "${SOURCE_SHA}" \
              --arg title "${release_title}" \
              --arg body "$(< "${notes_file}")" \
              '{tag_name: $tag, target_commitish: $target, name: $title, body: $body, draft: true, prerelease: false}')"
            create_response="$(mktemp)"
            if ! create_status="$(curl --silent --show-error \
              --output "${create_response}" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Content-Type: application/json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary "${create_payload}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases")"; then
              echo "::error::Unable to create the marked draft release."
              exit 1
            fi
            if [[ "${create_status}" != "201" ]]; then
              echo "::error::Draft creation returned HTTP ${create_status}; no existing release will be modified."
              exit 1
            fi
            active_release_id="$(jq -r '.id // empty' "${create_response}")"
            if [[ ! "${active_release_id}" =~ ^[1-9][0-9]*$ ]] \
              || ! assert_owned_draft_json "$(< "${create_response}")"; then
              echo "::error::GitHub's 201 response did not identify the new draft with exact workflow ownership."
              exit 1
            fi
            load_active_draft --wait-for-created-draft >/dev/null
          fi

          # Refuse to touch arbitrary assets. Both the target and exact stale names
          # must carry this release's workflow ownership label.
          draft_json="$(load_active_draft)"
          if ! assert_known_asset_set <<< "${draft_json}"; then
            echo "::error::The draft contains an unknown or ambiguously named asset; nothing was changed."
            exit 1
          fi
          target_count="$(jq --arg name "${target_name}" --arg marker "${asset_marker}" '[.assets[] | select(.name == $name and .label == $marker)] | length' <<< "${draft_json}")"
          target_is_current=false
          if [[ "${target_count}" == "1" ]]; then
            target_asset_id="$(jq -r --arg name "${target_name}" --arg marker "${asset_marker}" '.assets[] | select(.name == $name and .label == $marker) | .id' <<< "${draft_json}")"
            target_asset_size="$(jq -r --arg name "${target_name}" --arg marker "${asset_marker}" '.assets[] | select(.name == $name and .label == $marker) | .size' <<< "${draft_json}")"
            target_asset_digest="$(jq -r --arg name "${target_name}" --arg marker "${asset_marker}" '.assets[] | select(.name == $name and .label == $marker) | (.digest // "")' <<< "${draft_json}")"
            if asset_matches_local "${target_asset_id}" "${target_asset_size}" "${target_asset_digest}"; then
              target_is_current=true
            else
              match_status="$?"
              if [[ "${match_status}" == "2" ]]; then
                exit 1
              fi
            fi
          fi

          if [[ "${target_is_current}" != "true" ]]; then
            upload_candidate_asset
            draft_json="$(load_active_draft)"
            if ! assert_known_asset_set <<< "${draft_json}"; then
              echo "::error::The draft asset set changed after upload; it was preserved."
              exit 1
            fi
            candidate_count="$(jq --argjson id "${candidate_asset_id}" --arg name "${candidate_name}" --arg marker "${asset_marker}" '[.assets[] | select(.id == $id and .name == $name and .label == $marker)] | length' <<< "${draft_json}")"
            if [[ "${candidate_count}" != "1" ]]; then
              echo "::error::The marked candidate installer could not be identified uniquely."
              exit 1
            fi
            if asset_matches_local "${candidate_asset_id}" "${candidate_asset_size}" "${candidate_asset_digest}"; then
              :
            else
              match_status="$?"
              echo "::error::The uploaded candidate installer did not pass exact verification (status ${match_status})."
              exit 1
            fi

            if [[ "${target_count}" == "1" ]]; then
              draft_json="$(load_active_draft)"
              current_target_count="$(jq --argjson id "${target_asset_id}" --arg name "${target_name}" --arg marker "${asset_marker}" '[.assets[] | select(.id == $id and .name == $name and .label == $marker)] | length' <<< "${draft_json}")"
              if [[ "${current_target_count}" != "1" ]]; then
                echo "::error::The workflow-owned target installer changed before replacement; refusing to rename it."
                exit 1
              fi
              old_stale_name="${stale_prefix}asset-${target_asset_id}"
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${target_asset_id}" \
                --raw-field name="${old_stale_name}" \
                --raw-field label="${asset_marker}" >/dev/null
            fi

            draft_json="$(load_active_draft)"
            if ! assert_known_asset_set <<< "${draft_json}" \
              || [[ "$(jq --arg name "${target_name}" '[.assets[] | select(.name == $name)] | length' <<< "${draft_json}")" != "0" \
              || "$(jq --argjson id "${candidate_asset_id}" --arg name "${candidate_name}" --arg marker "${asset_marker}" '[.assets[] | select(.id == $id and .name == $name and .label == $marker)] | length' <<< "${draft_json}")" != "1" ]]; then
              echo "::error::The draft changed before candidate activation; it was preserved."
              exit 1
            fi
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${candidate_asset_id}" \
              --raw-field name="${target_name}" \
              --raw-field label="${asset_marker}" >/dev/null
          fi

          draft_json="$(load_active_draft)"
          if ! assert_known_asset_set <<< "${draft_json}"; then
            echo "::error::The draft contains an unknown asset after target reconciliation; it was preserved."
            exit 1
          fi
          active_target_count="$(jq --arg name "${target_name}" --arg marker "${asset_marker}" '[.assets[] | select(.name == $name and .label == $marker)] | length' <<< "${draft_json}")"
          if [[ "${active_target_count}" != "1" ]]; then
            echo "::error::The draft does not have one exactly workflow-owned target installer."
            exit 1
          fi
          active_target_id="$(jq -r --arg name "${target_name}" --arg marker "${asset_marker}" '.assets[] | select(.name == $name and .label == $marker) | .id' <<< "${draft_json}")"
          active_target_size="$(jq -r --arg name "${target_name}" --arg marker "${asset_marker}" '.assets[] | select(.name == $name and .label == $marker) | .size' <<< "${draft_json}")"
          active_target_digest="$(jq -r --arg name "${target_name}" --arg marker "${asset_marker}" '.assets[] | select(.name == $name and .label == $marker) | (.digest // "")' <<< "${draft_json}")"
          if asset_matches_local "${active_target_id}" "${active_target_size}" "${active_target_digest}"; then
            :
          else
            match_status="$?"
            echo "::error::The active installer failed exact verification (status ${match_status})."
            exit 1
          fi

          draft_json="$(load_active_draft)"
          if ! assert_known_asset_set <<< "${draft_json}"; then
            echo "::error::The draft asset set changed before release metadata refresh; it was preserved."
            exit 1
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${active_release_id}" \
            --raw-field name="${release_title}" \
            --raw-field body="$(< "${notes_file}")" \
            --field draft=true >/dev/null

          # Delete only stale assets with both the exact owned label and an exact
          # workflow stale name. Unknown assets are never renamed or deleted.
          draft_json="$(load_active_draft)"
          while IFS= read -r stale_asset_id; do
            [[ -n "${stale_asset_id}" ]] || continue
            if [[ ! "${stale_asset_id}" =~ ^[0-9]+$ ]]; then
              echo "::error::A workflow stale asset ID is invalid; the draft was preserved."
              exit 1
            fi
            draft_json="$(load_active_draft)"
            if ! assert_known_asset_set <<< "${draft_json}" \
              || [[ "$(jq --argjson id "${stale_asset_id}" --arg marker "${asset_marker}" --arg prefix "${stale_prefix}" '[.assets[] | select(.id == $id and .label == $marker and (.name | startswith($prefix)) and ((.name | ltrimstr($prefix)) | test("^(run-[0-9]+-[0-9]+|asset-[0-9]+)$")))] | length' <<< "${draft_json}")" != "1" ]]; then
              echo "::error::A stale asset lost its workflow ownership proof; refusing deletion."
              exit 1
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${stale_asset_id}" >/dev/null
          done < <(jq -r --arg marker "${asset_marker}" --arg prefix "${stale_prefix}" '.assets[] | select(.label == $marker and (.name | startswith($prefix)) and ((.name | ltrimstr($prefix)) | test("^(run-[0-9]+-[0-9]+|asset-[0-9]+)$"))) | .id' <<< "${draft_json}")

          draft_json="$(load_active_draft)"
          draft_asset_count="$(jq '.assets | length' <<< "${draft_json}")"
          draft_valid_asset_count="$(jq --arg name "${target_name}" --arg marker "${asset_marker}" '[.assets[] | select(.name == $name and .label == $marker and .state == "uploaded" and .size > 0)] | length' <<< "${draft_json}")"
          final_draft_target_id="$(jq -r --arg name "${target_name}" --arg marker "${asset_marker}" '.assets[] | select(.name == $name and .label == $marker) | .id' <<< "${draft_json}")"
          final_draft_target_size="$(jq -r --arg name "${target_name}" --arg marker "${asset_marker}" '.assets[] | select(.name == $name and .label == $marker) | .size' <<< "${draft_json}")"
          final_draft_target_digest="$(jq -r --arg name "${target_name}" --arg marker "${asset_marker}" '.assets[] | select(.name == $name and .label == $marker) | (.digest // "")' <<< "${draft_json}")"
          if [[ ! "${active_release_id}" =~ ^[0-9]+$ \
            || "$(jq -r '.id' <<< "${draft_json}")" != "${active_release_id}" \
            || "$(jq -r '.draft' <<< "${draft_json}")" != "true" \
            || "${draft_asset_count}" != "1" \
            || "${draft_valid_asset_count}" != "1" \
            || "${final_draft_target_id}" != "${active_target_id}" ]] \
            || ! assert_known_asset_set <<< "${draft_json}"; then
            echo "::error::Draft release validation failed for ${RELEASE_TAG}."
            exit 1
          fi
          if asset_matches_local "${final_draft_target_id}" "${final_draft_target_size}" "${final_draft_target_digest}"; then
            :
          else
            match_status="$?"
            echo "::error::The final draft installer failed exact verification (status ${match_status})."
            exit 1
          fi

          draft_json="$(load_active_draft)"
          prepublish_target_count="$(jq --argjson id "${final_draft_target_id}" --arg name "${target_name}" --arg marker "${asset_marker}" '[.assets[] | select(.id == $id and .name == $name and .label == $marker and .state == "uploaded" and .size > 0)] | length' <<< "${draft_json}")"
          if ! assert_known_asset_set <<< "${draft_json}" \
            || [[ "${prepublish_target_count}" != "1" || "$(jq '.assets | length' <<< "${draft_json}")" != "1" ]]; then
            echo "::error::The draft asset set changed immediately before publication; it was preserved."
            exit 1
          fi
          prepublish_target_size="$(jq -r --argjson id "${final_draft_target_id}" '.assets[] | select(.id == $id) | .size' <<< "${draft_json}")"
          prepublish_target_digest="$(jq -r --argjson id "${final_draft_target_id}" '.assets[] | select(.id == $id) | (.digest // "")' <<< "${draft_json}")"
          if asset_matches_local "${final_draft_target_id}" "${prepublish_target_size}" "${prepublish_target_digest}"; then
            :
          else
            match_status="$?"
            echo "::error::The installer changed immediately before publication (status ${match_status})."
            exit 1
          fi
          normalize_response="$(gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${active_release_id}" \
            --raw-field tag_name="${RELEASE_TAG}" \
            --raw-field name="${release_title}" \
            --raw-field body="$(< "${notes_file}")" \
            --field draft=true \
            --field prerelease=false)"
          if [[ "$(jq -r '.id' <<< "${normalize_response}")" != "${active_release_id}" \
            || "$(jq -r '.draft' <<< "${normalize_response}")" != "true" \
            || "$(jq -r '.prerelease' <<< "${normalize_response}")" != "false" \
            || "$(jq -r '.tag_name' <<< "${normalize_response}")" != "${RELEASE_TAG}" \
            || "$(jq -r '.name' <<< "${normalize_response}")" != "${release_title}" \
            || "$(jq -r '.author.login' <<< "${normalize_response}")" != "github-actions[bot]" ]] \
            || ! has_exact_release_marker <<< "${normalize_response}"; then
            echo "::error::GitHub did not confirm canonical draft normalization for release ${active_release_id}."
            exit 1
          fi

          canonical_draft_json="$(load_active_draft)"
          canonical_draft_asset_count="$(jq '.assets | length' <<< "${canonical_draft_json}")"
          canonical_draft_valid_asset_count="$(jq \
            --argjson id "${final_draft_target_id}" \
            --arg name "${target_name}" \
            --arg marker "${asset_marker}" '
              [.assets[] | select(
                .id == $id
                and .name == $name
                and .label == $marker
                and .state == "uploaded"
                and .size > 0
                and ((.digest // "") | test("^sha256:[0-9a-fA-F]{64}$"))
              )] | length
            ' <<< "${canonical_draft_json}")"
          canonical_draft_target_size="$(jq -r --argjson id "${final_draft_target_id}" '.assets[] | select(.id == $id) | .size' <<< "${canonical_draft_json}")"
          canonical_draft_target_digest="$(jq -r --argjson id "${final_draft_target_id}" '.assets[] | select(.id == $id) | (.digest // "")' <<< "${canonical_draft_json}")"
          if [[ "$(jq -r '.tag_name' <<< "${canonical_draft_json}")" != "${RELEASE_TAG}" \
            || "$(jq -r '.draft' <<< "${canonical_draft_json}")" != "true" \
            || "$(jq -r '.prerelease' <<< "${canonical_draft_json}")" != "false" \
            || "${canonical_draft_asset_count}" != "1" \
            || "${canonical_draft_valid_asset_count}" != "1" ]] \
            || ! assert_known_asset_set <<< "${canonical_draft_json}"; then
            echo "::error::Canonical draft revalidation failed for release ${active_release_id}."
            exit 1
          fi
          if asset_matches_local "${final_draft_target_id}" "${canonical_draft_target_size}" "${canonical_draft_target_digest}"; then
            :
          else
            match_status="$?"
            echo "::error::The canonical draft installer failed exact local hash verification (status ${match_status})."
            exit 1
          fi

          publish_response="$(gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${active_release_id}" \
            --field draft=false \
            --field prerelease=false \
            --raw-field make_latest=true)"
          if [[ "$(jq -r '.id' <<< "${publish_response}")" != "${active_release_id}" \
            || "$(jq -r '.draft' <<< "${publish_response}")" != "false" \
            || "$(jq -r '.prerelease' <<< "${publish_response}")" != "false" \
            || "$(jq -r '.tag_name' <<< "${publish_response}")" != "${RELEASE_TAG}" \
            || "$(jq -r '.name' <<< "${publish_response}")" != "${release_title}" \
            || "$(jq -r '.author.login' <<< "${publish_response}")" != "github-actions[bot]" ]] \
            || ! has_exact_release_marker <<< "${publish_response}"; then
            echo "::error::GitHub did not confirm publication of canonical release ${active_release_id}."
            exit 1
          fi
          published_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${active_release_id}")"
          published_asset_count="$(jq '.assets | length' <<< "${published_json}")"
          published_valid_asset_count="$(jq --arg name "${target_name}" --arg marker "${asset_marker}" '[.assets[] | select(.name == $name and .label == $marker and .state == "uploaded" and .size > 0 and ((.digest // "") | test("^sha256:[0-9a-fA-F]{64}$")))] | length' <<< "${published_json}")"
          published_target_id="$(jq -r --arg name "${target_name}" --arg marker "${asset_marker}" '.assets[] | select(.name == $name and .label == $marker) | .id' <<< "${published_json}")"
          published_target_size="$(jq -r --arg name "${target_name}" --arg marker "${asset_marker}" '.assets[] | select(.name == $name and .label == $marker) | .size' <<< "${published_json}")"
          published_target_digest="$(jq -r --arg name "${target_name}" --arg marker "${asset_marker}" '.assets[] | select(.name == $name and .label == $marker) | (.digest // "")' <<< "${published_json}")"
          canonical_published_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          assert_exact_tag_ref
          if [[ "$(jq -r '.draft' <<< "${published_json}")" != "false" \
            || "$(jq -r '.prerelease' <<< "${published_json}")" != "false" \
            || "$(jq -r '.id' <<< "${published_json}")" != "${active_release_id}" \
            || "$(jq -r '.tag_name' <<< "${published_json}")" != "${RELEASE_TAG}" \
            || "$(jq -r '.name' <<< "${published_json}")" != "${release_title}" \
            || "$(jq -r '.author.login' <<< "${published_json}")" != "github-actions[bot]" \
            || "${published_asset_count}" != "1" \
            || "${published_valid_asset_count}" != "1" \
            || "${published_target_id}" != "${active_target_id}" \
            || "$(jq -r '.id' <<< "${canonical_published_json}")" != "${active_release_id}" \
            || "$(jq -r '.draft' <<< "${canonical_published_json}")" != "false" \
            || "$(jq -r '.prerelease' <<< "${canonical_published_json}")" != "false" \
            || "$(jq -r '.tag_name' <<< "${canonical_published_json}")" != "${RELEASE_TAG}" ]] \
            || ! has_exact_release_marker <<< "${published_json}"; then
            echo "::error::Published release validation failed for ${RELEASE_TAG}."
            exit 1
          fi
          if asset_matches_local "${published_target_id}" "${published_target_size}" "${published_target_digest}"; then
            :
          else
            match_status="$?"
            echo "::error::The published installer failed exact verification (status ${match_status})."
            exit 1
          fi
          failure_guard_enabled=false
          trap - ERR
          echo "Published ${RELEASE_TAG} from ${SOURCE_SHA} with $(basename "${asset}")."

  recover-publish:
    name: Recover verified Pi Console release
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
      SOURCE_SHA: ${{ inputs.recovery_source_sha }}
      VERSION: ${{ inputs.recovery_version }}
      RELEASE_ID: ${{ inputs.recovery_release_id }}
      EXPECTED_SIZE: ${{ inputs.recovery_expected_size }}
      EXPECTED_SHA256: ${{ inputs.recovery_expected_sha256 }}
    steps:
      - name: Download previously verified installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pi-console-${{ inputs.recovery_source_sha }}
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.recovery_run_id }}

      - name: Validate ownership and publish recovered release
        run: |
          set -Eeuo pipefail

          if [[ ! "${RECOVERY_RUN_ID}" =~ ^[1-9][0-9]*$ \
            || ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ \
            || ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ \
            || ! "${RELEASE_ID}" =~ ^[1-9][0-9]*$ \
            || ! "${EXPECTED_SIZE}" =~ ^[1-9][0-9]*$ \
            || ! "${EXPECTED_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Recovery inputs are malformed."
            exit 1
          fi

          release_tag="v${VERSION}"
          release_title="Pi Console ${release_tag}"
          release_marker="<!-- pi-console-release-workflow-owned:v1 tag=${release_tag} source=${SOURCE_SHA} -->"
          asset_marker="pi-console-release-workflow-owned:v1:${release_tag}:${SOURCE_SHA}"
          target_name="PiConsole-Setup-${VERSION}.exe"
          asset="release-assets/${target_name}"

          if [[ ! -s "${asset}" ]]; then
            echo "::error::The verified recovery installer is missing or empty."
            exit 1
          fi
          asset_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          local_size="$(stat -c '%s' "${asset}")"
          local_sha256="$(sha256sum "${asset}" | awk '{print $1}')"
          if [[ "${asset_count}" != "1" \
            || "${local_size}" != "${EXPECTED_SIZE}" \
            || "${local_sha256}" != "${EXPECTED_SHA256}" ]]; then
            echo "::error::The recovery artifact does not match the verified installer fingerprint."
            exit 1
          fi

          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}")"
          if [[ "$(jq -r '.object.type' <<< "${tag_json}")" != "commit" \
            || "$(jq -r '.object.sha' <<< "${tag_json}")" != "${SOURCE_SHA}" ]]; then
            echo "::error::${release_tag} does not point directly to the verified source commit."
            exit 1
          fi

          load_draft() {
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          }
          assert_owned_draft() {
            jq -e \
              --argjson id "${RELEASE_ID}" \
              --arg tag "${release_tag}" \
              --arg title "${release_title}" \
              --arg marker "${release_marker}" \
              --arg source "${SOURCE_SHA}" '
                def marker_count($marker):
                  ((.body // "") | split("\n") | map(rtrimstr("\r")) | map(select(. == $marker)) | length);
                .id == $id
                and .draft == true
                and .prerelease == false
                and .tag_name == $tag
                and .name == $title
                and .target_commitish == $source
                and .author.login == "github-actions[bot]"
                and marker_count($marker) == 1
              ' >/dev/null
          }
          assert_owned_asset() {
            jq -e \
              --arg name "${target_name}" \
              --arg marker "${asset_marker}" \
              --argjson size "${EXPECTED_SIZE}" \
              --arg digest "sha256:${EXPECTED_SHA256}" '
                .name == $name
                and .label == $marker
                and .state == "uploaded"
                and .size == $size
                and (.digest // "") == $digest
              ' >/dev/null
          }

          draft_json="$(load_draft)"
          if ! assert_owned_draft <<< "${draft_json}"; then
            echo "::error::Release ${RELEASE_ID} is not the exact workflow-owned recovery draft."
            exit 1
          fi

          existing_count="$(jq '.assets | length' <<< "${draft_json}")"
          if [[ "${existing_count}" == "0" ]]; then
            upload_url="$(jq -r '.upload_url | sub("\\{.*$"; "")' <<< "${draft_json}")"
            encoded_name="$(jq -nr --arg value "${target_name}" '$value | @uri')"
            encoded_label="$(jq -nr --arg value "${asset_marker}" '$value | @uri')"
            upload_response="$(mktemp)"
            upload_status="$(curl --fail --silent --show-error \
              --output "${upload_response}" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Content-Type: application/octet-stream" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @"${asset}" \
              "${upload_url}?name=${encoded_name}&label=${encoded_label}")"
            if [[ "${upload_status}" != "201" ]] || ! assert_owned_asset < "${upload_response}"; then
              echo "::error::GitHub did not confirm the exact recovered installer upload."
              exit 1
            fi
          elif [[ "${existing_count}" == "1" ]]; then
            if ! jq -e '.assets[0]' <<< "${draft_json}" | assert_owned_asset; then
              echo "::error::The existing draft asset is not the exact verified installer."
              exit 1
            fi
          else
            echo "::error::The recovery draft contains an unexpected asset set."
            exit 1
          fi

          draft_json="$(load_draft)"
          if ! assert_owned_draft <<< "${draft_json}" \
            || [[ "$(jq '.assets | length' <<< "${draft_json}")" != "1" ]] \
            || ! jq -e '.assets[0]' <<< "${draft_json}" | assert_owned_asset; then
            echo "::error::The recovered draft failed final pre-publication validation."
            exit 1
          fi

          publish_response="$(gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --field draft=false \
            --field prerelease=false \
            --raw-field make_latest=true)"
          canonical_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}")"
          if [[ "$(jq -r '.id' <<< "${publish_response}")" != "${RELEASE_ID}" \
            || "$(jq -r '.draft' <<< "${publish_response}")" != "false" \
            || "$(jq -r '.prerelease' <<< "${publish_response}")" != "false" \
            || "$(jq -r '.id' <<< "${canonical_release}")" != "${RELEASE_ID}" \
            || "$(jq -r '.draft' <<< "${canonical_release}")" != "false" \
            || "$(jq '.assets | length' <<< "${canonical_release}")" != "1" ]] \
            || ! jq -e '.assets[0]' <<< "${canonical_release}" | assert_owned_asset; then
            echo "::error::The recovered release failed final publication validation."
            exit 1
          fi

          echo "Recovered and published ${release_tag} from ${SOURCE_SHA} with ${target_name}."
